function worker(id){return data.workers.find(w=>w.id===id)}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){showToast('Browser storage unavailable. Changes may be temporary.',true);return false}}
function showToast(msg,bad=false){const n=el('notices');n.innerHTML=`<div class="toast ${bad?'bad':''}" role="status">${safe(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.innerHTML='',3800)}
function addNotification(text){data.notifications.unshift({id:String(Date.now())+Math.random().toString(36).slice(2,5),text,when:new Date().toISOString(),read:false});data.notifications=data.notifications.slice(0,25)}
function km(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,do2=(b.lon-a.lon)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(do2/2)**2;return (6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))).toFixed(1)}
function nearby(id){return data.workers.filter(w=>w.service===id&&w.online&&!data.bookings.some(b=>b.workerId===w.id&&!['completed','cancelled'].includes(b.status))).map(w=>({...w,distance:km(area(data.area),area(w.area))})).sort((a,b)=>Number(a.distance)-Number(b.distance))}
function statusText(s){return ({requested:'Requested',assigned:'Assigned',accepted:'Accepted',onway:'On the way',inprogress:'In progress',completed:'Completed',cancelled:'Cancelled'})[s]||s}
function statusPill(s){return `pill ${s==='completed'?'green':s==='cancelled'?'red':s==='requested'?'orange':'blue'}`}
function statusIndex(s){return ({requested:0,assigned:1,accepted:2,onway:3,inprogress:4,completed:5,cancelled:0})[s]||0}
function bookingBadge(b){return `<span class="${statusPill(b.status)}">${safe(statusText(b.status))}</span>`}
function iconTxt(s){return `${s.emoji} ${safe(s.name)}`}
function mockDay(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function render(){el('topLocation').textContent='Surat · '+area(data.area).name+' ▾';el('noticeDot').classList.toggle('hidden',!data.notifications.some(n=>!n.read));document.querySelectorAll('.rolepill').forEach(b=>{const a=b.dataset.value===role;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))});el('appmain').innerHTML=`<div class="demo-alert"><span aria-hidden="true" style="font-size:20px">🧪</span><div><b>MANRAJ Phase 2C · Functional public demo</b>Fictional customers, workers, prices and bookings. No real SMS, payments, accounts, background GPS tracking or live server.</div></div>${role==='customer'?renderCustomer():role==='partner'?renderPartner():renderAdmin()}<footer class="footer">MANRAJ MANPOWER CORPORATION · Surat · Phase 2C Demo v${VERSION}<br>Not a commercial booking service. All examples are fictional.</footer>`;renderNav();}
function renderNav(){const actions=role==='customer'?[['home','⌂','Explore'],['bookings','▤','Bookings'],['saved','♡','Saved'],['account','☻','Account']]:role==='partner'?[['jobs','▤','Jobs'],['availability','◉','Availability'],['earnings','₹','Earnings'],['account','☻','Account']]:[['overview','▦','Overview'],['orders','▤','Bookings'],['workers','♙','Workers'],['account','☻','Account']];el('bottomnav').innerHTML=`<div class="navinside">${actions.map(([pg,ico,name])=>`<button class="navbtn ${page===pg?'active':''}" data-action="navigate" data-value="${pg}" aria-label="${name}" aria-current="${page===pg?'page':'false'}"><b>${ico}</b><span>${name}</span></button>`).join('')}</div>`}
function renderCustomer(){if(page==='bookings')return renderCustomerBookings();if(page==='saved')return renderSaved();if(page==='account')return renderAccount();return renderExplore();}
function renderExplore(){let filtered=SERVICES.filter(s=>(filter==='All'||filter===s.type)&&(`${s.name} ${s.desc} ${s.type}`).toLowerCase().includes(query.toLowerCase()));return `<div class="hero"><div class="herotext"><small>YOUR CITY. YOUR SERVICE.</small><h1>Expert help,<br>just a tap away.</h1><p>Explore home care, repairs, construction and more.</p><button class="btn small" data-action="scrollservices">Explore services ↗</button></div><div class="heroicons" aria-hidden="true">🧰</div></div><div class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" aria-label="Search services" placeholder="Search mason, cook, electrician..." value="${safe(query)}"><span style="font-size:12px;color:var(--leaf);font-weight:900">SERVICES</span></div><div class="chips" aria-label="Filter services">${['All','Home care','Repairs','Construction','Lifestyle','Safety'].map(x=>`<button class="chip ${filter===x?'active':''}" data-action="filter" data-value="${safe(x)}" aria-pressed="${filter===x}">${x==='All'?'✨ ':''}${safe(x)}</button>`).join('')}</div><section id="services" class="section"><div class="heading"><div><p class="tinylabel">DISCOVER MANRAJ</p><h2>What do you need today?</h2><p class="sub">13 categories · Sample hourly rates · Surat demo</p></div><span class="filtercount" id="resultsCount">${filtered.length} services</span></div><div class="svcgrid" id="servicegrid">${serviceCards(filtered)}</div></section><section class="section"><div class="heading"><div><p class="tinylabel">WHY MANRAJ</p><h2>Designed around your day</h2></div></div><div class="perkgrid"><div class="perk"><div class="perkicon">✅</div><div><strong>Verified worker flow</strong><span>Admin verification planned</span></div></div><div class="perk"><div class="perkicon">📍</div><div><strong>Nearby matching</strong><span>Demo localities in Surat</span></div></div><div class="perk"><div class="perkicon">📲</div><div><strong>Simple tracking</strong><span>Booking status progression</span></div></div></div></section>`}
function serviceCards(arr){return arr.length?arr.map(s=>`<div style="position:relative"><button type="button" class="servicecard" data-action="service" data-value="${s.id}" aria-label="Book ${safe(s.name)}"><div class="servicelogo" aria-hidden="true">${s.emoji}</div><div class="servicename">${safe(s.name)}</div><div class="servicedesc">${safe(s.desc)}</div><div class="serviceprice">${money(s.price)} <span class="muted" style="font-size:10px;font-weight:650">/ demo hr</span></div></button><button class="heart ${data.favourites.includes(s.id)?'saved':''}" data-action="favourite" data-value="${s.id}" aria-label="${data.favourites.includes(s.id)?'Remove from':'Add to'} favourites">${data.favourites.includes(s.id)?'♥':'♡'}</button></div>`).join(''):`<div class="empty" style="grid-column:1/-1"><div class="emptyicon">🔎</div>No services match your search.<p>Try another category or search term.</p><button class="btn small" data-action="clearfilter">Show all</button></div>`}
function bookingCard(b,context){const w=worker(b.workerId);let buttons='';if(context==='customer'&&['requested','assigned'].includes(b.status))buttons=`<button class="btn danger small" data-action="cancel" data-id="${b.id}">Cancel demo booking</button>`;if(context==='admin'&&b.status==='requested'){const choices=nearby(b.service).map(x=>`<option value="${x.id}">${safe(x.name)} · ${x.distance} km</option>`).join('');buttons=choices?`<div class="toolbar"><select id="assign-${b.id}" aria-label="Choose demo worker">${choices}</select><button class="btn small" data-action="assign" data-id="${b.id}">Assign worker →</button></div>`:`<p class="inlineerr">No available matching demo worker.</p>`}if(context==='partner'){const next={assigned:['accepted','Accept job'],accepted:['onway','On the way'],onway:['inprogress','Start work'],inprogress:['completed','Complete job']}[b.status];if(next)buttons=`<button class="btn small" data-action="advance" data-id="${b.id}">${next[1]} →</button>`;}return `<article class="card job"><div class="jobtop"><span class="jobid">#${safe(b.id)}</span>${bookingBadge(b)}</div><h3 class="jobtitle">${service(b.service).emoji} ${safe(service(b.service).name)}</h3><div class="jobmeta">📍 ${safe(area(b.area).name)}, Surat · ${safe(b.day)} · ${safe(b.slot)}<br>👤 ${safe(b.alias)} · ${safe(b.hours)} demo hour${b.hours>1?'s':''}<br>🧰 Partner: ${w?safe(w.name):'Awaiting admin assignment'}</div><div class="steps" aria-label="Job status progress">${[0,1,2,3,4,5].map(i=>`<span class="step ${i<=statusIndex(b.status)&&b.status!=='cancelled'?'on':''}"></span>`).join('')}</div><div class="jobfoot"><span class="money">${money(b.total)} <small class="muted" style="font-weight:500;font-size:10px">mock total</small></span><button class="btn outline small" data-action="bookingdetail" data-id="${b.id}">Track details ↗</button></div>${buttons}</article>`}
function renderCustomerBookings(){return `<div class="heading"><div><p class="tinylabel">YOUR ACTIVITIES</p><h2>My demo bookings</h2><p class="sub">Bookings are saved only in this browser.</p></div><button class="btn small" data-action="navigate" data-value="home">+ New</button></div><div class="liststack">${data.bookings.length?data.bookings.map(b=>bookingCard(b,'customer')).join(''):`<div class="empty"><div class="emptyicon">🗓️</div>No demo bookings yet.<p>Try booking Rajmistri / Kadiya or Housekeeping.</p><button class="btn" data-action="navigate" data-value="home">Browse services</button></div>`}</div>`}
function renderSaved(){const ss=SERVICES.filter(s=>data.favourites.includes(s.id));return `<div class="heading"><div><p class="tinylabel">SHORTLIST</p><h2>Saved services</h2><p class="sub">Your local favourites.</p></div></div><div class="svcgrid">${serviceCards(ss)}</div>`}
function renderAccount(){return `<div class="heading"><div><p class="tinylabel">DEMO PROFILE</p><h2>MANRAJ account</h2><p class="sub">No real sign-in or identity verification.</p></div></div><section class="card"><div class="workerline"><div class="workeravatar">🙋</div><div class="workerdetail"><strong>Demo User</strong><small>Customer • MANRAJ sandbox</small></div>${role==='customer'?'<span class="pill green">Customer</span>':''}</div></section><section class="card section"><h3>🔐 Simulated OTP test</h3><p class="mutetxt">No SMS is sent. The OTP appears on-screen only. This does not authenticate an account.</p><button class="btn soft" data-action="otp">Open OTP test</button>${otpPassed?'<span class="pill green" style="margin-left:9px">Demo OTP passed</span>':''}</section><section class="card section"><h3>📍 GPS permission test</h3><p class="mutetxt">Optional location permission. Actual coordinates are not saved, displayed, or sent by this demo.</p><button class="btn soft" data-action="gps">Test GPS permission</button><p class="testresult" id="gpsResult">${safe(gpsReport)}</p></section><section class="card section"><h3>Demo controls</h3><p class="mutetxt">Clear local demo bookings and restore fictional worker availability.</p><button class="btn danger" data-action="reset">Reset demo data</button></section><div class="note">🔒 This public static GitHub Pages demo has no backend and no secure accounts. Never use real customer information, phone numbers, API credentials, or production payments.</div>`}
function renderPartner(){if(page==='account')return renderAccount();const active=data.bookings.filter(b=>b.workerId===selectedWorker);const w=worker(selectedWorker)||data.workers[0];if(page==='availability')return `<div class="heading"><div><p class="tinylabel">PARTNER SETTINGS</p><h2>My availability</h2></div></div>${partnerSelect()}<div class="card section"><div class="switchline"><div><h3>Worker status</h3><p class="mutetxt">Demo mode only. Admin cannot assign new work when offline.</p></div><button class="btn ${w.online?'soft':'dark'}" data-action="toggleavailable">${w.online?'● Online – Go offline':'○ Offline – Go online'}</button></div></div>`;if(page==='earnings'){const completed=active.filter(b=>b.status==='completed');return `<div class="heading"><div><p class="tinylabel">MOCK PAYOUTS</p><h2>Demo earnings</h2></div></div>${partnerSelect()}<div class="stats"><div class="stat"><strong>${completed.length}</strong><small>Completed jobs</small></div><div class="stat"><strong>${money(completed.reduce((x,b)=>x+b.subtotal,0))}</strong><small>Simulated value</small></div></div><div class="note">No earnings, wallet transfers or real payouts are created.</div>`}
return `<div class="heading"><div><p class="tinylabel">MANRAJ PARTNER</p><h2>Your jobs dashboard</h2><p class="sub">Manage assigned demo jobs.</p></div><span class="pill ${w.online?'green':'red'}">● ${w.online?'Online':'Offline'}</span></div>${partnerSelect()}<div class="banner"><div class="workerline"><div class="workeravatar">🧰</div><div class="workerdetail"><strong>${safe(w.name)}</strong><small>${safe(service(w.service).name)} · ${safe(area(w.area).name)} · Demo</small></div><span class="pill green">★ ${w.rating}</span></div></div><div class="stats"><div class="stat"><strong>${active.filter(b=>!['completed','cancelled'].includes(b.status)).length}</strong><small>Active jobs</small></div><div class="stat"><strong>${active.filter(b=>b.status==='completed').length}</strong><small>Completed</small></div></div><section><div class="heading"><div><p class="tinylabel">ASSIGNMENTS</p><h2>Jobs for this partner</h2></div></div><div class="liststack">${active.length?active.map(b=>bookingCard(b,'partner')).join(''):`<div class="empty"><div class="emptyicon">📭</div>No jobs assigned to this partner.<p>Create a Customer booking, then assign this worker in MANRAJ Admin.</p><button class="btn soft" data-action="role" data-value="admin">Open Admin demo</button></div>`}</div></section>`}
function partnerSelect(){return `<div class="card"><div class="field" style="margin:0"><label for="partnerSelect">Demo partner identity</label><select id="partnerSelect" data-change="worker">${data.workers.map(w=>`<option value="${w.id}" ${w.id===selectedWorker?'selected':''}>${safe(w.name)} · ${safe(service(w.service).name)}</option>`).join('')}</select></div><p class="smallprint">Demo role switch only. Not a secure partner login.</p></div>`}
function renderAdmin(){if(page==='account')return renderAccount();if(page==='workers')return adminWorkers();const all=data.bookings;if(page==='orders')return `<div class="heading"><div><p class="tinylabel">DISPATCH CENTER</p><h2>All demo bookings</h2></div></div><div class="liststack">${all.length?all.map(b=>bookingCard(b,'admin')).join(''):`<div class="empty"><div class="emptyicon">📭</div>No booking requests. Make one in Customer view.</div>`}</div>`;return `<div class="heading"><div><p class="tinylabel">MANRAJ COMMAND CENTER</p><h2>Admin overview</h2><p class="sub">Fictional dispatch simulation, not authenticated.</p></div><span class="pill green">● Demo console</span></div><div class="stats"><div class="stat"><strong>${all.length}</strong><small>Total requests</small></div><div class="stat"><strong>${all.filter(b=>!['completed','cancelled'].includes(b.status)).length}</strong><small>Active jobs</small></div><div class="stat"><strong>${data.workers.filter(w=>w.online).length}</strong><small>Online partners</small></div><div class="stat"><strong>${money(all.filter(b=>b.status==='completed').reduce((a,b)=>a+b.total,0))}</strong><small>Mock GMV</small></div></div><section class="section"><div class="heading"><div><p class="tinylabel">OPERATIONS</p><h2>Needs your attention</h2></div><button class="btn soft small" data-action="navigate" data-value="orders">View all</button></div><div class="liststack">${all.length?all.map(b=>bookingCard(b,'admin')).join(''):`<div class="empty"><div class="emptyicon">📋</div>No requests yet.<p>Switch to Customer, book a service, and return here to assign a worker.</p><button class="btn" data-action="role" data-value="customer">Create demo booking</button></div>`}</div></section>`}
function adminWorkers(){return `<div class="heading"><div><p class="tinylabel">PARTNER NETWORK</p><h2>Demo workers</h2><p class="sub">16 fictional profiles with demo service locations.</p></div></div><div class="liststack">${data.workers.map(w=>`<div class="card workerline"><div class="workeravatar">${service(w.service).emoji}</div><div class="workerdetail"><strong>${safe(w.name)}</strong><small>${safe(service(w.service).name)} · ${safe(area(w.area).name)} · ★ ${w.rating}</small></div><span class="pill ${w.online?'green':'red'}">${w.online?'Online':'Offline'}</span></div>`).join('')}</div>`}
function navigate(next){page=next;render();window.scrollTo({top:0,behavior:'instant'})}
function switchRole(next){if(!['customer','partner','admin'].includes(next))return;role=next;page=next==='customer'?'home':next==='partner'?'jobs':'overview';render();window.scrollTo({top:0,behavior:'instant'})}
function openDrawer(type,opts={}){drawer=type;lastFocus=document.activeElement;document.body.style.overflow='hidden';let html='';if(type==='booking')html=drawBooking(opts.service||'mason');if(type==='location')html=drawLocation();if(type==='otp')html=drawOtp();if(type==='notifications')html=drawNotifications();if(type==='bookingdetail')html=drawDetail(opts.id);el('drawerhost').innerHTML=`<div class="drawerwrap" data-action="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-label="MANRAJ ${safe(type)}"><div class="drawerhead"><h2>${safe(({booking:'Book a service',location:'Choose demo location',otp:'Simulated OTP test',notifications:'Notifications',bookingdetail:'Booking tracking'})[type])}</h2><button class="closebtn" data-action="close" aria-label="Close dialog">×</button></div>${html}</div></div>`;setTimeout(()=>el('drawerhost').querySelector('.closebtn')?.focus(),0)}
function closeDrawer(){drawer='';document.body.style.overflow='';el('drawerhost').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function drawBooking(id){draftService=id;draftSlot='10:00 AM';const s=service(id);const choices=nearby(id);return `<div class="service-detail"><span aria-hidden="true">${s.emoji}</span><div><strong>${safe(s.name)}</strong><p class="mutetxt" style="margin:5px 0">${safe(s.desc)}</p><strong class="money">${money(s.price)}/demo hour</strong></div></div><div class="note">✅ Sample service request. Admin assigns a fictional partner after booking. No worker is actually notified.</div><section class="section"><h3>Nearby demo workers</h3><div class="neargrid">${choices.length?choices.slice(0,3).map(w=>`<div class="nearcard"><div class="workerline"><span class="workeravatar" style="width:35px;height:35px;font-size:18px">👷</span><div class="workerdetail"><strong>${safe(w.name)}</strong><small>★ ${w.rating} · ${w.jobs} mock jobs</small></div></div><div class="distance">📍 ${w.distance} km (demo)</div></div>`).join(''):'<p class="mutetxt">No available demo workers now. Booking can still be requested.</p>'}</div></section><form id="bookingForm" autocomplete="off"><div class="field"><label for="alias">Customer nickname — fictional only *</label><input id="alias" name="alias" required maxlength="50" minlength="2" value="Demo Customer" placeholder="Demo Customer"></div><div class="field"><label for="street">Demo service address *</label><textarea id="street" name="street" required minlength="5" maxlength="140">Sample Street, ${safe(area(data.area).name)}, Surat</textarea></div><div class="fieldrow"><div class="field"><label for="day">Preferred day</label><select id="day" name="day"><option value="${mockDay(0)}">Today · ${mockDay(0)}</option><option selected value="${mockDay(1)}">Tomorrow · ${mockDay(1)}</option><option value="${mockDay(2)}">${mockDay(2)}</option></select></div><div class="field"><label for="hours">Duration</label><select id="hours" name="hours" data-change="hours">${[1,2,3,4,6,8].map(x=>`<option value="${x}" ${x===2?'selected':''}>${x} hour${x>1?'s':''}</option>`).join('')}</select></div></div><div class="field"><label>Preferred time slot</label><div class="slotwrap">${['10:00 AM','12:00 PM','03:00 PM','06:00 PM'].map(s=>`<button type="button" class="slot ${s===draftSlot?'active':''}" data-action="slot" data-value="${s}" aria-pressed="${s===draftSlot}">${s}</button>`).join('')}</div></div><div class="field"><label for="method">Payment method (demo only)</label><select id="method" name="method"><option value="COD demo">Pay after service (mock)</option><option value="Prepaid demo">Prepaid preview (no charge)</option></select></div><section class="card" style="margin-top:18px"><h3 style="margin:0 0 15px">Price preview</h3><div class="summary"><span>Service (${money(s.price)} × <b id="hoursSummary">2</b> hr)</span><strong id="subtotal">${money(s.price*2)}</strong></div><div class="summary"><span>Platform fee (demo)</span><strong>${money(29)}</strong></div><div class="summary bold"><span>Estimated mock total</span><span id="total">${money(s.price*2+29)}</span></div></section><div class="bottombill"><p class="smallprint">Not a real transaction. Do not enter your real address.</p><button type="submit" class="btn full">Confirm demo booking →</button></div></form>`}
function drawLocation(){return `<p class="mutetxt">Choose a fictional Surat locality for nearby worker suggestions. GPS coordinates are never saved.</p><div class="locationbox">${AREAS.map(a=>`<button class="locitem ${data.area===a.id?'active':''}" data-action="setlocation" data-value="${a.id}">📍 ${safe(a.name)} ${data.area===a.id?'✓':''}</button>`).join('')}</div><div class="section"><button class="btn outline full" data-action="gps">🧭 Test GPS permission (optional)</button><p class="testresult" id="gpsResult">${safe(gpsReport)}</p></div>`}
function drawOtp(){return `<p class="mutetxt">This is an interactive simulation only, not a sign-in. No SMS or real identity verification.</p><button class="btn soft full" data-action="generateotp">Generate six-digit demo OTP</button><div class="codebox" id="codebox">${demoOtp?`<strong>${demoOtp}</strong><span>On-screen demo code — not an SMS</span>`:'<span>No OTP generated yet</span>'}</div><form id="otpForm"><div class="field"><label for="otpInput">Enter the code shown above</label><input id="otpInput" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="6-digit demo code" required></div><button class="btn full" type="submit">Verify demo code</button></form><div id="otpResult" class="testresult">${otpPassed?'✅ Previous demo OTP passed.':'Awaiting code.'}</div>`}
function drawNotifications(){data.notifications.forEach(n=>n.read=true);store();el('noticeDot').classList.add('hidden');return `<p class="mutetxt">Local demonstration alerts only; no push notifications.</p>${data.notifications.length?data.notifications.map(n=>`<div class="card" style="margin:10px 0"><strong style="font-size:13px">🔔 ${safe(n.text)}</strong><p class="smallprint">${safe(new Date(n.when).toLocaleString('en-IN'))}</p></div>`).join(''):`<div class="empty">🔔 No demo notifications yet.<p>Create a booking to see simulated alerts.</p></div>`}`}
function drawDetail(id){const b=data.bookings.find(x=>x.id===id);if(!b)return '<p>Booking not found.</p>';const w=worker(b.workerId);return `<div class="card"><div class="jobtop"><span class="jobid">#${safe(b.id)}</span>${bookingBadge(b)}</div><h3 style="margin-top:12px">${service(b.service).emoji} ${safe(service(b.service).name)}</h3><p class="mutetxt">${safe(b.alias)} · ${safe(b.day)} ${safe(b.slot)} · ${safe(b.hours)} demo hrs</p><p class="mutetxt">📍 ${safe(area(b.area).name)}, Surat · ${safe(b.address)}</p><p class="mutetxt">🧰 ${w?safe(w.name):'Not yet assigned'}</p><div class="summary bold"><span>Mock price</span><span>${money(b.total)}</span></div></div><section class="section"><h3>Booking timeline</h3>${b.history.map(h=>`<div class="workerline" style="margin:13px 0"><div class="workeravatar" style="width:32px;height:32px;font-size:15px">✓</div><div class="workerdetail"><strong>${safe(statusText(h.status))}</strong><small>${safe(new Date(h.at).toLocaleString('en-IN'))}</small></div></div>`).join('')}</section><p class="smallprint">All records and payment amounts are fictional and stored locally in this browser only.</p>`}
function createBooking(f){const alias=String(f.get('alias')||'').trim(),address=String(f.get('street')||'').trim(),day=String(f.get('day')||''),hours=Number(f.get('hours'));if(alias.length<2||address.length<5||!Number.isInteger(hours)||hours<1||hours>8){showToast('Complete all required demo booking details.',true);return}if(!/^(Demo |Sample |Test )/i.test(alias)||!/sample|demo|test/i.test(address)){showToast('Use fictional demo names and addresses only.',true);return}const s=service(draftService);const b={id:'MR'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),service:s.id,alias:alias.slice(0,50),address:address.slice(0,140),area:data.area,day,slot:draftSlot,hours,subtotal:s.price*hours,fee:29,total:s.price*hours+29,payment:String(f.get('method')||'COD demo'),status:'requested',workerId:null,createdAt:new Date().toISOString(),history:[{status:'requested',at:new Date().toISOString()}]};data.bookings.unshift(b);addNotification('New demo booking '+s.name+' · '+b.id);store();closeDrawer();page='bookings';render();window.scrollTo({top:0,behavior:'instant'});showToast('✅ Demo booking created! Now open MANRAJ Admin to assign a worker.')}
function updateBooking(b,st){b.status=st;b.history.push({status:st,at:new Date().toISOString()});store()}
function assignBooking(id){const b=data.bookings.find(x=>x.id===id);if(!b||b.status!=='requested')return showToast('Booking can no longer be assigned.',true);const select=el('assign-'+id),w=worker(select?.value);if(!w||w.service!==b.service||!nearby(b.service).some(x=>x.id===w.id))return showToast('Choose an available matching worker.',true);b.workerId=w.id;updateBooking(b,'assigned');selectedWorker=w.id;addNotification('Demo worker '+w.name+' assigned to '+b.id);store();render();showToast('✅ Worker assigned. Open MANRAJ Partner to accept the job.')}
function advanceBooking(id){const b=data.bookings.find(x=>x.id===id),next={assigned:'accepted',accepted:'onway',onway:'inprogress',inprogress:'completed'};if(!b||b.workerId!==selectedWorker||!next[b.status])return showToast('Unable to update this job.',true);updateBooking(b,next[b.status]);addNotification('Job '+b.id+': '+statusText(b.status));store();render();showToast('✅ Job updated to '+statusText(b.status))}
function cancelBooking(id){const b=data.bookings.find(x=>x.id===id);if(!b||!['requested','assigned'].includes(b.status))return showToast('This job cannot be cancelled.',true);if(!confirm('Cancel this fictional demo booking?'))return;updateBooking(b,'cancelled');addNotification('Demo booking '+b.id+' cancelled');store();render();showToast('Demo booking cancelled.')}
function reset(){if(!confirm('Delete ALL fictional demo bookings, favourites and worker statuses from this browser?'))return;data=init();store();query='';filter='All';selectedWorker='mw1';otpPassed=false;demoOtp='';gpsReport='GPS has not been tested.';closeDrawer();switchRole('customer');showToast('Demo data reset successfully.')}
function generateOtp(){demoOtp=String(Math.floor(100000+Math.random()*900000));otpPassed=false;const box=el('codebox');if(box)box.innerHTML=`<strong>${demoOtp}</strong><span>On-screen demo code — not an SMS</span>`;if(el('otpResult'))el('otpResult').textContent='Enter the code shown above. No SMS sent.';if(el('otpInput'))el('otpInput').value='';}
function verifyOtp(code){if(!demoOtp){if(el('otpResult'))el('otpResult').textContent='Generate a demo OTP first.';return}if(code===demoOtp){otpPassed=true;demoOtp='';if(el('otpResult'))el('otpResult').textContent='✅ Demo OTP verified. This is NOT actual login or authentication.';if(el('codebox'))el('codebox').innerHTML='<span>Code consumed — generate another to repeat the test</span>';showToast('✅ Simulated OTP test passed')}else{otpPassed=false;if(el('otpResult'))el('otpResult').textContent='❌ Incorrect demo code. Please re-enter the displayed OTP.';showToast('Incorrect demo OTP',true)}}
function gps(){const out=el('gpsResult');gpsReport='Requesting location permission...';if(out)out.textContent=gpsReport;if(!navigator.geolocation){gpsReport='GPS unavailable in this browser. Demo locality can still be used.';if(out)out.textContent=gpsReport;return}navigator.geolocation.getCurrentPosition(p=>{gpsReport='✅ GPS permission granted. Approximate accuracy '+Math.round(p.coords.accuracy)+' m. Coordinates were not stored, displayed or sent.';if(el('gpsResult'))el('gpsResult').textContent=gpsReport},e=>{gpsReport='GPS access unavailable or denied. Please use fictional demo locality.';if(el('gpsResult'))el('gpsResult').textContent=gpsReport},{enableHighAccuracy:false,timeout:12000,maximumAge:0})}
function recalc(){const hours=Number(el('hours')?.value||2),s=service(draftService);if(el('hoursSummary'))el('hoursSummary').textContent=String(hours);if(el('subtotal'))el('subtotal').textContent=money(s.price*hours);if(el('total'))el('total').textContent=money(s.price*hours+29)}
// One delegated event handler per event type keeps every re-rendered button functional on Safari & Chrome.
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;const act=button.dataset.action,value=button.dataset.value,id=button.dataset.id;if(act==='overlay'&&e.target!==button)return;if(['role','navigate','filter','favourite','service','location','notifications','otp','gps','generateotp','slot','setlocation','bookingdetail','close','overlay','cancel','assign','advance','toggleavailable','reset','scrollservices','clearfilter'].includes(act))e.preventDefault();switch(act){case 'role':switchRole(value);break;case 'navigate':navigate(value);break;case 'filter':filter=value;render();break;case 'clearfilter':filter='All';query='';render();break;case 'favourite':data.favourites=data.favourites.includes(value)?data.favourites.filter(x=>x!==value):[...data.favourites,value];store();render();showToast(data.favourites.includes(value)?'Added to saved services':'Removed from saved services');break;case 'service':openDrawer('booking',{service:value});break;case 'location':openDrawer('location');break;case 'notifications':openDrawer('notifications');break;case 'otp':openDrawer('otp');break;case 'gps':gps();break;case 'generateotp':generateOtp();break;case 'slot':draftSlot=value;document.querySelectorAll('.slot').forEach(b=>{b.classList.toggle('active',b.dataset.value===value);b.setAttribute('aria-pressed',String(b.dataset.value===value))});break;case 'setlocation':data.area=value;store();closeDrawer();render();showToast('Demo locality: '+area(value).name);break;case 'bookingdetail':openDrawer('bookingdetail',{id});break;case 'close':case 'overlay':closeDrawer();break;case 'cancel':cancelBooking(id);break;case 'assign':assignBooking(id);break;case 'advance':advanceBooking(id);break;case 'toggleavailable':{const w=worker(selectedWorker);if(w){if(!w.online&&!data.bookings.some(b=>b.workerId===w.id&&!['completed','cancelled'].includes(b.status))){w.online=true}else if(w.online){w.online=false}else return showToast('Finish active jobs before going online.',true);store();render();showToast(w.online?'Partner online':'Partner offline')}break}case 'reset':reset();break;case 'scrollservices':el('services')?.scrollIntoView({behavior:'smooth'});break;}});
document.addEventListener('submit',e=>{if(e.target.id==='bookingForm'){e.preventDefault();createBooking(new FormData(e.target))}if(e.target.id==='otpForm'){e.preventDefault();verifyOtp(String(new FormData(e.target).get('code')||'').trim())}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.change==='worker'){selectedWorker=t.value;render()}if(t.dataset.change==='hours')recalc()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){const start=t.selectionStart;query=t.value;const filtered=SERVICES.filter(s=>(filter==='All'||filter===s.type)&&(`${s.name} ${s.desc} ${s.type}`).toLowerCase().includes(query.toLowerCase()));el('servicegrid').innerHTML=serviceCards(filtered);el('resultsCount').textContent=filtered.length+' services';try{t.setSelectionRange(start,start)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer)closeDrawer()});
render();
</script>
